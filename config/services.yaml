parameters:
    env(APP_SECRET): 'change_me'
    env(API_KEY): 'default-api-key-change-me'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $projectDir: '%kernel.project_dir%'
            $apiKey: '%env(API_KEY)%'

    Bareapi\:
        resource: '../src/*'
        exclude: '../src/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}'

    Bareapi\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    # Repository interfaces
    Bareapi\Repository\SchemaRepositoryInterface:
        class: Bareapi\Repository\SchemaRepository

    Bareapi\Repository\MetaObjectRepositoryInterface:
        class: Bareapi\Repository\MetaObjectRepository

    # Service interfaces
    Bareapi\Service\SchemaServiceInterface:
        class: Bareapi\Service\SchemaService

    Bareapi\EventListener\ExceptionListener:
        arguments:
            $kernelEnvironment: '%kernel.environment%'
        tags:
            - { name: kernel.event_listener, event: kernel.exception }
